idea:
  title: Can self-report training help lie confession?
  domain: artificial_intelligence
  hypothesis: "There is a growing body of work on introspective behavior in language\
    \ models. I\u2019m interested in whether self-report training, training a model\
    \ to predict or explain its own behavior, can help it recognize and confess when\
    \ it has lied.\nMy hypothesis is that confessing a lie requires the model to compare\
